aid: cribl
name: Cribl
kind: company
description: >-
  Cribl is an observability pipeline company providing a suite of products for collecting, processing, routing,
  searching, and storing telemetry data at scale. Cribl's developer platform offers REST APIs across Stream, Edge,
  Search, Lake, and the As Code product line, exposing programmatic control over data pipelines, edge agents, federated
  search jobs, lake datasets, and infrastructure-as-code configuration management. The Cribl Cloud API acts as a
  centrally managed control plane across all deployments and authenticates with OAuth 2.0 client credentials.
url: https://raw.githubusercontent.com/api-evangelist/cribl/refs/heads/main/apis.yml
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/cribl.png
tags:
  - Configuration
  - Data Lake
  - Data Pipelines
  - Data Routing
  - Edge Computing
  - Infrastructure as Code
  - Observability
  - Search
  - Security Data
  - Stream Processing
  - Telemetry
created: '2025-03-05'
modified: '2026-05-19'
specificationVersion: '0.20'
type: Index
access: 3rd-Party
position: Consuming
